spring.application.name=facturacion
# Suficiente para ejecutar demo y pruebas sin agotar el servidor local.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/facturacion}
spring.datasource.username=${DB_USER:facturacion_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never

# No inventar identidad del emisor. Configurar antes de usar fiscalmente el sistema.
facturacion.emisor.razon-social=${EMISOR_RAZON_SOCIAL:}
facturacion.emisor.cuit=${EMISOR_CUIT:}
facturacion.emisor.domicilio=${EMISOR_DOMICILIO:}
facturacion.emisor.condicion-iva=${EMISOR_CONDICION_IVA:}
facturacion.emisor.ingresos-brutos=${EMISOR_INGRESOS_BRUTOS:}
facturacion.emisor.inicio-actividades=${EMISOR_INICIO_ACTIVIDADES:}
facturacion.emisor.datos-demostracion=${EMISOR_DATOS_DEMOSTRACION:false}

arca.homologacion.enabled=${ARCA_HOMOLOGACION_ENABLED:false}
arca.homologacion.directorio=${ARCA_HOMOLOGACION_DIRECTORIO:.local/arca-homologacion}
arca.homologacion.punto-venta=${ARCA_HOMOLOGACION_PUNTO_VENTA:2}
